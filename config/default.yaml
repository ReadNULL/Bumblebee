# Bumblebee 配置文件示例

personality:
  intensity: moderate  # low | moderate | high
  theme: transformers  # transformers | neutral

memory:
  enabled: true
  maxHistory: 100

ai:
  provider: anthropic  # anthropic | openai | gemini | bedrock
  model: claude-sonnet-4-6
  temperature: 0.7
  maxTokens: 4096
  # apiKey: your-api-key-here

# 渠道配置（按需启用，详见 docs/channels/）
channels: {}
  # wechat:
  #   enabled: true
  #   puppet: wechaty-puppet-padlocal    # 可选: padlocal / wechat4u / wechat-openai
  #   token: your-padlocal-token          # padlocal 需要 token
  #
  # feishu:
  #   enabled: true
  #   appId: cli_xxxxx                    # 飞书开放平台 → 应用详情 → 凭证
  #   appSecret: xxxxx                    # 飞书开放平台 → 应用详情 → 凭证
  #   # encryptKey: xxxxx                 # 可选，事件加密密钥
  #   # verificationToken: xxxxx          # 可选，事件验证令牌
  #
  # dingtalk:
  #   enabled: true
  #   mode: webhook                       # webhook（仅发送）| enterprise（双向）
  #   webhook: https://oapi.dingtalk.com/robot/send?access_token=xxxxx
  #   # 企业应用模式:
  #   # appKey: xxxxx
  #   # appSecret: xxxxx
  #   # robotCode: xxxxx
