# Bumblebee configuration example

personality:
  intensity: moderate  # low | moderate | high
  theme: transformers  # transformers | neutral

memory:
  enabled: true
  maxHistory: 100

ai:
  provider: anthropic  # anthropic | openai | gemini | bedrock
  model: claude-sonnet-4-6
  temperature: 0.7
  maxTokens: 4096
  # Do not store plaintext API keys here. Use environment variables instead:
  # ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / AWS credentials.

# Channel configuration. Enable only the channels you need.
channels:
