# Bumblebee configuration example

personality:
  intensity: moderate  # low | moderate | high
  theme: transformers  # transformers | neutral

memory:
  enabled: true

llm:
  timeoutMs: 300000

# Model provider, model name and API keys are managed by pi-coding-agent.
# Set environment variables such as ANTHROPIC_API_KEY / OPENAI_API_KEY,
# then use /model in the TUI to inspect or switch the active model.

# Channel configuration. Enable only the channels you need.
channels:
  # wechat:
  #   enabled: true
  #   mode: official-account
  #   token: ${WECHAT_OFFICIAL_TOKEN}
  #   appId: ${WECHAT_OFFICIAL_APP_ID}
  #   appSecret: ${WECHAT_OFFICIAL_APP_SECRET}
  #   port: 3002
  #   path: /wechat
  #
  # # Personal account via ilink API (QR login, no extra config):
  # # wechat:
  # #   enabled: true
  # #   mode: weixinbot
  #
  # feishu:
  #   enabled: true
  #   appId: ${FEISHU_APP_ID}
  #   appSecret: ${FEISHU_APP_SECRET}
  #   # encryptKey: ${FEISHU_ENCRYPT_KEY}
  #   # verificationToken: ${FEISHU_VERIFICATION_TOKEN}
  #
  # dingtalk:
  #   enabled: true
  #   mode: webhook
  #   webhook: ${DINGTALK_WEBHOOK}
  #   # Enterprise mode:
  #   # mode: enterprise
  #   # appKey: ${DINGTALK_APP_KEY}
  #   # appSecret: ${DINGTALK_APP_SECRET}
  #   # robotCode: ${DINGTALK_ROBOT_CODE}

plugins:
  enabled: false
  modules: []
  # directory: ./plugins
  toolTimeoutMs: 10000
  commandTimeoutMs: 10000
  eventLoopWarningMs: 250
