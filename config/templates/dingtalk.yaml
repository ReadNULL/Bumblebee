# 钉钉渠道配置模板
#
# 支持两种模式:
#   A. Webhook 模式 — 仅支持发送消息到群，不能接收消息（快速体验）
#   B. 企业应用模式 — 双向通信，支持接收消息（生产推荐）
#
# ============================
# 模式 A: Webhook（仅发送）
# ============================
#
# 申请步骤:
#   1. 打开钉钉群 → 群设置 → 智能群助手 → 添加机器人
#   2. 选择"自定义"机器人
#   3. 设置机器人名称，安全设置选择"自定义关键词"（填入"Bumblebee"）
#   4. 复制 Webhook 地址
#
# ============================
# 模式 B: 企业应用（双向）
# ============================
#
# 申请步骤:
#   1. 登录钉钉开放平台 https://open-dev.dingtalk.com
#   2. 创建应用 → 企业内部应用
#   3. 添加"机器人"能力
#   4. 凭证与基础信息 → 获取 AppKey 和 AppSecret
#   5. 机器人详情 → 获取 Robot Code
#   6. 消息接收模式 → 配置回调 URL（需公网可达，或使用内网穿透）
#
# 连接方式:
#   TUI 中使用 /channel-connect dingtalk 连接

channels:
  dingtalk:
    enabled: true

    # 模式选择: webhook（仅发送）| enterprise（双向）
    mode: webhook

    # ---- Webhook 模式配置 ----
    # 群机器人 Webhook 地址
    webhook: ${DINGTALK_WEBHOOK}

    # ---- 企业应用模式配置（mode: enterprise 时使用）----
    # appKey: ${DINGTALK_APP_KEY}
    # appSecret: ${DINGTALK_APP_SECRET}
    # robotCode: ${DINGTALK_ROBOT_CODE}

    # Webhook 模式支持: 文本、Markdown、链接、ActionCard 消息
    # 企业应用模式支持: 文本、富文本、@提及、Markdown
