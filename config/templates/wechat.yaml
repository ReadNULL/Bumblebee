# WeChat channel configuration template
#
# Two modes are available:
# 1. official-account — WeChat Official Account callback API (recommended)
# 2. weixinbot — Personal WeChat via ilink API (QR login, no extra config)

# --- Mode 1: Official Account (recommended) ---
# 1. Enable server configuration in WeChat Official Account Platform.
# 2. Set URL to a public address plus path, for example: https://example.com/wechat.
# 3. Use the same Token here and in the WeChat server configuration.
# 4. For local development, expose this port with ngrok/cpolar or a similar tunnel.

channels:
  wechat:
    enabled: true
    mode: official-account
    token: ${WECHAT_OFFICIAL_TOKEN}
    appId: ${WECHAT_OFFICIAL_APP_ID}
    appSecret: ${WECHAT_OFFICIAL_APP_SECRET}
    port: 3002
    path: /wechat

    # appId/appSecret can be omitted if replies always finish within the
    # passive reply window.
    # If an LLM response misses that window, Bumblebee attempts to use the
    # customer-service API, which requires appId/appSecret and matching account
    # capabilities.

# --- Mode 2: Personal account via ilink API ---
# No extra configuration needed. Token is cached after QR login.
# channels:
#   wechat:
#     enabled: true
#     mode: weixinbot
